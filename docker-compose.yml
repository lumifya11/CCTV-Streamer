services:
  redis:
    image: redis:7.2-alpine
    container_name: cctv-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    networks:
      - cctv_internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
        reservations:
          cpus: "0.10"
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cctv-mediamtx
    restart: unless-stopped
    volumes:
      - ./media/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings_data:/recordings
    expose:
      - "9997"
      - "8554"
    ports:
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_WEBRTC_UDP_PORT:-8189}:8189/udp"
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"
    networks:
      - cctv_internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  discovery:
    build:
      context: .
      dockerfile: services/discovery/Dockerfile
    container_name: cctv-discovery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-personal_lan}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - DATABASE_URL=sqlite:////data/cctv_streamer.db
      - DISCOVERY_HOST=0.0.0.0
      - DISCOVERY_PORT=8001
      - DISCOVERY_SUBNETS=${DISCOVERY_SUBNETS:-192.168.1.0/24}
      - DISCOVERY_PORTS=${DISCOVERY_PORTS:-554,8554,80,8000,8080,8899}
      - ENABLE_DEMO_STREAMS=${ENABLE_DEMO_STREAMS:-false}
    volumes:
      - cctv_db_data:/data
    expose:
      - "8001"
    networks:
      - cctv_internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  transcoder:
    build:
      context: .
      dockerfile: services/transcoder/Dockerfile
    container_name: cctv-transcoder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-personal_lan}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - DATABASE_URL=sqlite:////data/cctv_streamer.db
      - TRANSCODER_HOST=0.0.0.0
      - TRANSCODER_PORT=8002
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - RTSP_TRANSPORT=${RTSP_TRANSPORT:-tcp}
      - STREAM_TARGET_FPS=${STREAM_TARGET_FPS:-20}
      - STREAM_JPEG_QUALITY=${STREAM_JPEG_QUALITY:-80}
      - STREAM_FRAME_WIDTH=${STREAM_FRAME_WIDTH:-1280}
      - STREAM_FRAME_HEIGHT=${STREAM_FRAME_HEIGHT:-720}
      - STREAM_BUFFER_SIZE=${STREAM_BUFFER_SIZE:-2}
      - ENABLE_DEMO_STREAMS=${ENABLE_DEMO_STREAMS:-false}
    volumes:
      - cctv_db_data:/data
      - recordings_data:/recordings
    expose:
      - "8002"
    networks:
      - cctv_internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    container_name: cctv-processor
    restart: unless-stopped
    depends_on:
      transcoder:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-personal_lan}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - DATABASE_URL=sqlite:////data/cctv_streamer.db
      - PROCESSOR_HOST=0.0.0.0
      - PROCESSOR_PORT=8003
      - TRANSCODER_SERVICE_URL=http://transcoder:8002
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MOTION_SENSITIVITY_THRESHOLD=${MOTION_SENSITIVITY_THRESHOLD:-500.0}
      - MOTION_MIN_CONTOUR_AREA=${MOTION_MIN_CONTOUR_AREA:-450}
    volumes:
      - cctv_db_data:/data
    expose:
      - "8003"
    networks:
      - cctv_internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.35"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: cctv-gateway
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_healthy
      transcoder:
        condition: service_healthy
      processor:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-personal_lan}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - GATEWAY_MODE=distributed
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8080
      - API_SECRET_KEY=${API_SECRET_KEY}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - DATABASE_URL=sqlite:////data/cctv_streamer.db
      - RECORDINGS_DIR=/recordings
      - DISCOVERY_SERVICE_URL=http://discovery:8001
      - TRANSCODER_SERVICE_URL=http://transcoder:8002
      - PROCESSOR_SERVICE_URL=http://processor:8003
      - MEDIAMTX_API_URL=http://mediamtx:9997
    volumes:
      - cctv_db_data:/data
      - recordings_data:/recordings
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - cctv_internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.20"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

networks:
  cctv_internal:
    driver: bridge

volumes:
  redis_data:
  cctv_db_data:
  recordings_data:
