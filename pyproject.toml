[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-streamer"
version = "1.0.0"
description = "Enterprise-grade, self-hosted CCTV monitoring system with ONVIF discovery, OpenCV RTSP stream transcoding, and real-time video analytics microservices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
